<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rooted 2026 Hymns</title>
<meta name="theme-color" content="#747d72">
<meta name="description" content="Rooted 2026 Hymns">
<link rel="stylesheet" href="css/styles.css?v=20260810">
</head>
<body>
<div class="container">
<header>
  <h1 class="site-title"><span class="site-title-hall">Rooted 2026</span><span class="site-title-book">Hymns</span></h1>
  <div class="controls">
    <div class="search-row">
      <input id="searchInput" aria-label="Go to hymn" placeholder="Go to hymn…" type="text" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" autocomplete="off">
      <div class="utility-row">
        <button id="indexBtn" type="button">Index</button>
        <button id="showAllBtn" type="button">All Hymns</button>
        <button id="settingsBtn" type="button" aria-label="Hymn size">Aa</button>
      </div>
    </div>
    <div id="settingsDrawer" class="settings-drawer" aria-hidden="true">
      <div class="font-size-controls">
        <div class="font-size-label">Hymn Size</div>
        <div class="font-size-slider-row">
          <button id="fontDecreaseBtn" type="button">A−</button>
          <input id="fontSizeSlider" type="range" min="60" max="100" step="5" value="85" aria-label="Hymn size">
          <button id="fontIncreaseBtn" type="button">A+</button>
        </div>
        <div id="fontSizeDisplay" class="font-size-display">85%</div>
      </div>
    </div>
  </div>
</header>
<main class="main">
  <section class="section">
    <div id="index" class="index"></div>
    <div id="hymns"></div>
  </section>
</main>
</div>
<script src="data/hymns.js?v=20260810"></script>
<script src="js/app.js?v=20260810-3"></script>
</body>
</html>
